<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Productos — Los Pellot LED</title>
  <link rel="icon" href="assets/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css" />
</head>
<body class="bg-bg text-white antialiased">

  <div id="site-header"></div>

  <section class="border-b border-white/5 bg-surface/40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
      <h1 class="font-display text-4xl font-bold tracking-wide">PRODUCTOS</h1>
      <p class="text-sm text-muted mt-2">LEDs y accesorios para tu vehículo — filtra por vehículo o categoría.</p>
    </div>
  </section>

  <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 grid lg:grid-cols-[260px_1fr] gap-10">

    <!-- ============================= FILTER SIDEBAR ============================= -->
    <aside>
      <button id="filters-toggle" class="lg:hidden w-full flex items-center justify-between bg-surface border border-white/10 rounded-xl px-4 py-3 mb-4">
        <span class="text-sm font-semibold">Filtros</span>
        <span id="filters-chevron"><span data-icon="chevronDown" data-icon-cls="w-4 h-4"></span></span>
      </button>

      <div id="filters-panel" class="hidden lg:block space-y-8 lg:sticky lg:top-28">

        <div>
          <h3 class="text-xs font-bold tracking-[0.15em] text-muted mb-3">TU VEHÍCULO</h3>
          <div class="space-y-2">
            <select id="v-year" class="w-full bg-surface border border-white/10 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-blue"></select>
            <select id="v-make" class="w-full bg-surface border border-white/10 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-blue" disabled></select>
            <select id="v-model" class="w-full bg-surface border border-white/10 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-blue" disabled></select>
          </div>
        </div>

        <div>
          <div class="flex items-center justify-between mb-3">
            <h3 class="text-xs font-bold tracking-[0.15em] text-muted">CATEGORÍA</h3>
          </div>
          <div id="category-filters" class="space-y-1"></div>
        </div>

        <div>
          <h3 class="text-xs font-bold tracking-[0.15em] text-muted mb-3">DISPONIBILIDAD</h3>
          <label class="flex items-center gap-2 text-sm text-muted">
            <input type="checkbox" id="f-sale" class="accent-blue w-4 h-4 rounded" /> Solo ofertas
          </label>
        </div>

        <button id="clear-filters" class="text-xs text-blue-glow hover:text-white transition">Limpiar todos los filtros</button>
      </div>
    </aside>

    <!-- ============================= RESULTS ============================= -->
    <div>
      <div class="flex flex-wrap items-center justify-between gap-4 mb-6">
        <p id="result-count" class="text-sm text-muted">Mostrando productos</p>
        <div class="flex items-center gap-3">
          <label for="sort" class="text-xs text-muted">Ordenar por</label>
          <select id="sort" class="bg-surface border border-white/10 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue">
            <option value="relevance">Relevancia</option>
            <option value="price-asc">Precio: Menor a Mayor</option>
            <option value="price-desc">Precio: Mayor a Menor</option>
            <option value="name-asc">Nombre: A–Z</option>
          </select>
        </div>
      </div>

      <div id="active-chips" class="flex flex-wrap gap-2 mb-6"></div>

      <div id="vehicle-banner" class="hidden items-center gap-3 bg-blue/10 border border-blue/30 rounded-xl px-4 py-3 mb-6 text-sm">
        <span class="text-blue-glow"><span data-icon="check" data-icon-cls="w-4 h-4"></span></span>
        <span id="vehicle-banner-text"></span>
      </div>

      <div id="product-grid" class="grid grid-cols-2 md:grid-cols-3 gap-5"></div>

      <div id="empty-state" class="hidden text-center py-24">
        <div class="w-16 h-16 rounded-full bg-surface-2 flex items-center justify-center text-muted mx-auto mb-4"><span data-icon="search" data-icon-cls="w-7 h-7"></span></div>
        <p class="text-white font-semibold">No encontramos productos con esos filtros</p>
        <p class="text-sm text-muted mt-1">Intenta ajustar o limpiar los filtros.</p>
      </div>
    </div>
  </section>

  <div id="site-footer"></div>
  <div id="cart-root"></div>

  <script src="js/icons.js"></script>
  <script src="js/data.js"></script>
  <script src="js/chrome.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/products-ui.js"></script>
  <script>
    mountChrome("products");
    wireAddToCartButtons();

    const params = new URLSearchParams(window.location.search);
    const state = {
      categories: new Set(params.get("category") ? [params.get("category")] : []),
      year: params.get("year") || "",
      make: params.get("make") || "",
      model: params.get("model") || "",
      q: params.get("q") || "",
      saleOnly: false,
      sort: "relevance",
    };

    // Category checkboxes
    const catFilterEl = document.getElementById("category-filters");
    catFilterEl.innerHTML = CATEGORIES.map(c => `
      <label class="flex items-center gap-2 text-sm text-muted hover:text-white cursor-pointer py-1">
        <input type="checkbox" class="cat-checkbox accent-blue w-4 h-4 rounded" value="${c.id}" ${state.categories.has(c.id) ? "checked" : ""} />
        ${c.name}
      </label>
    `).join("");

    catFilterEl.querySelectorAll(".cat-checkbox").forEach(cb => {
      cb.addEventListener("change", () => {
        cb.checked ? state.categories.add(cb.value) : state.categories.delete(cb.value);
        render();
      });
    });

    // Vehicle selectors
    wireVehicleSelectors({
      yearEl: document.getElementById("v-year"),
      makeEl: document.getElementById("v-make"),
      modelEl: document.getElementById("v-model"),
      initial: { year: state.year, make: state.make, model: state.model },
    });
    ["v-year", "v-make", "v-model"].forEach(id => {
      document.getElementById(id).addEventListener("change", (e) => {
        if (id === "v-year") state.year = e.target.value;
        if (id === "v-make") state.make = e.target.value;
        if (id === "v-model") state.model = e.target.value;
        render();
      });
    });

    document.getElementById("f-sale").addEventListener("change", (e) => {
      state.saleOnly = e.target.checked;
      render();
    });

    document.getElementById("sort").addEventListener("change", (e) => {
      state.sort = e.target.value;
      render();
    });

    document.getElementById("clear-filters").addEventListener("click", () => {
      state.categories.clear();
      state.year = state.make = state.model = state.q = "";
      state.saleOnly = false;
      document.getElementById("v-year").value = "";
      document.getElementById("v-year").dispatchEvent(new Event("change"));
      document.getElementById("f-sale").checked = false;
      catFilterEl.querySelectorAll(".cat-checkbox").forEach(cb => cb.checked = false);
      render();
    });

    document.getElementById("filters-toggle").addEventListener("click", () => {
      document.getElementById("filters-panel").classList.toggle("hidden");
    });

    function render() {
      let list = PRODUCTS.slice();

      if (state.categories.size > 0) list = list.filter(p => state.categories.has(p.category));
      if (state.saleOnly) list = list.filter(p => p.salePrice != null);
      if (state.q) {
        const q = state.q.toLowerCase();
        list = list.filter(p => p.name.toLowerCase().includes(q) || categoryName(p.category).toLowerCase().includes(q));
      }

      const vehicleSelected = state.year && state.make && state.model;
      const vehicleLabel = vehicleSelected ? `${state.year} ${state.make} ${state.model}` : null;
      const banner = document.getElementById("vehicle-banner");
      if (vehicleSelected) {
        banner.classList.remove("hidden"); banner.classList.add("flex");
        document.getElementById("vehicle-banner-text").textContent = `Mostrando compatibilidad para tu ${vehicleLabel}`;
      } else {
        banner.classList.add("hidden"); banner.classList.remove("flex");
      }

      if (state.sort === "price-asc") list.sort((a, b) => (a.salePrice ?? a.price) - (b.salePrice ?? b.price));
      if (state.sort === "price-desc") list.sort((a, b) => (b.salePrice ?? b.price) - (a.salePrice ?? a.price));
      if (state.sort === "name-asc") list.sort((a, b) => a.name.localeCompare(b.name));

      const grid = document.getElementById("product-grid");
      const empty = document.getElementById("empty-state");
      const countEl = document.getElementById("result-count");

      countEl.textContent = `Mostrando ${list.length} producto${list.length === 1 ? "" : "s"}`;

      if (list.length === 0) {
        grid.innerHTML = "";
        empty.classList.remove("hidden");
      } else {
        empty.classList.add("hidden");
        grid.innerHTML = list.map(p => renderProductCard(p, vehicleSelected ? { vehicle: vehicleLabel } : {})).join("");
      }

      renderChips();
    }

    function renderChips() {
      const chips = [];
      state.categories.forEach(c => chips.push({ label: categoryName(c), clear: () => { state.categories.delete(c); render(); } }));
      if (state.year) chips.push({ label: state.year, clear: () => { document.getElementById("v-year").value=""; document.getElementById("v-year").dispatchEvent(new Event("change")); state.year=state.make=state.model=""; render(); } });
      if (state.make) chips.push({ label: state.make, clear: () => { document.getElementById("v-make").value=""; document.getElementById("v-make").dispatchEvent(new Event("change")); state.make=state.model=""; render(); } });
      if (state.model) chips.push({ label: state.model, clear: () => { document.getElementById("v-model").value=""; state.model=""; render(); } });
      if (state.saleOnly) chips.push({ label: "Solo ofertas", clear: () => { document.getElementById("f-sale").checked=false; state.saleOnly=false; render(); } });

      const chipsEl = document.getElementById("active-chips");
      if (chips.length === 0) { chipsEl.innerHTML = ""; return; }

      chipsEl.innerHTML = chips.map((c, i) => `
        <button class="chip-clear inline-flex items-center gap-1.5 text-xs bg-surface-2 border border-white/10 rounded-full pl-3 pr-2 py-1.5 text-white hover:border-blue/40 transition" data-i="${i}">
          ${c.label} ${icon("close","w-3 h-3")}
        </button>
      `).join("");

      chipsEl.querySelectorAll(".chip-clear").forEach((btn, i) => {
        btn.addEventListener("click", () => chips[i].clear());
      });
    }

    render();
  </script>
</body>
</html>
