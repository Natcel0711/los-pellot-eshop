<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ofertas — Los Pellot LED</title>
  <link rel="icon" href="assets/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css" />
</head>
<body class="bg-bg text-white antialiased">

  <div id="site-header"></div>

  <section class="relative border-b border-amber/20 overflow-hidden">
    <div class="absolute -top-20 left-1/3 w-[500px] h-[500px] rounded-full bg-amber/10 blur-[130px] -z-10"></div>
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16 text-center">
      <p class="text-xs font-bold tracking-[0.2em] text-amber mb-3">OFERTAS POR TIEMPO LIMITADO</p>
      <h1 class="font-display text-5xl font-bold">HASTA 20% OFF</h1>
      <p class="text-sm text-muted mt-3 max-w-md mx-auto">Kits seleccionados de faros, luces traseras, underglow y más — mientras duren las unidades.</p>
    </div>
  </section>

  <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-14">
    <div class="flex items-center justify-between mb-8">
      <p id="offers-count" class="text-sm text-muted"></p>
      <select id="offers-sort" class="bg-surface border border-white/10 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue">
        <option value="discount">Mayor Descuento</option>
        <option value="price-asc">Precio: Menor a Mayor</option>
        <option value="price-desc">Precio: Mayor a Menor</option>
      </select>
    </div>
    <div id="offers-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5"></div>
  </section>

  <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <h2 class="font-display text-3xl font-bold tracking-wide mb-8">RECIÉN LLEGADOS</h2>
    <div id="new-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5"></div>
  </section>

  <div id="site-footer"></div>
  <div id="cart-root"></div>

  <script src="js/icons.js"></script>
  <script src="js/data.js"></script>
  <script src="js/chrome.js"></script>
  <script src="js/account.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/products-ui.js"></script>
  <script>
    mountChrome("offers");
    wireAddToCartButtons();

    function discountPct(p) {
      return p.salePrice != null ? Math.round((1 - p.salePrice / p.price) * 100) : 0;
    }

    function renderOffers() {
      let list = PRODUCTS.filter(p => p.salePrice != null);
      const sort = document.getElementById("offers-sort").value;
      if (sort === "discount") list.sort((a, b) => discountPct(b) - discountPct(a));
      if (sort === "price-asc") list.sort((a, b) => a.salePrice - b.salePrice);
      if (sort === "price-desc") list.sort((a, b) => b.salePrice - a.salePrice);

      document.getElementById("offers-count").textContent = `${list.length} productos en oferta`;
      document.getElementById("offers-grid").innerHTML = list.map(p => renderProductCard(p)).join("");
    }

    document.getElementById("offers-sort").addEventListener("change", renderOffers);
    renderOffers();

    const newArrivals = PRODUCTS.filter(p => p.badge === "New");
    document.getElementById("new-grid").innerHTML = newArrivals.map(p => renderProductCard(p)).join("");
  </script>
</body>
</html>
