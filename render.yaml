services:
  - type: web
    name: los-pellot-api
    runtime: docker
    plan: free
    dockerfilePath: ./server/LosPellot.Api/Dockerfile
    dockerContext: ./server/LosPellot.Api
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Jwt__Issuer
        value: LosPellot.Api
      - key: Jwt__Audience
        value: LosPellot.Client
      - key: Jwt__SigningKey
        generateValue: true
      - key: Cors__AllowedOrigins__0
        value: http://localhost:4200
      - key: Cors__AllowedOrigins__1
        value: https://lospellot.com
      - key: Cors__AllowedOrigins__2
        value: https://www.lospellot.com
      - key: Cors__AllowedOrigins__3
        sync: false
