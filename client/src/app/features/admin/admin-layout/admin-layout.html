<div class="min-h-screen flex flex-col lg:flex-row">
  <aside class="lg:w-60 shrink-0 border-b lg:border-b-0 lg:border-r border-white/10 bg-surface">
    <div class="p-5 border-b border-white/10">
      <p class="font-display text-lg font-bold tracking-wide text-white">ADMIN</p>
      <p class="text-xs text-muted mt-0.5">Los Pellot LED</p>
    </div>
    <nav class="p-3 flex lg:flex-col gap-1 overflow-x-auto lg:overflow-visible">
      @for (link of navLinks; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="bg-blue/15 text-blue-glow"
          [routerLinkActiveOptions]="{ exact: link.path === '/admin' }"
          class="flex items-center gap-2.5 px-3 py-2.5 rounded-lg text-sm font-semibold text-muted hover:text-white hover:bg-white/5 active:bg-white/10 transition whitespace-nowrap"
        >
          <app-icon [name]="link.icon" class="w-4 h-4" />
          {{ link.label }}
        </a>
      }
    </nav>
    <div class="p-3 border-t border-white/10 mt-2 space-y-1">
      @if (auth.currentUser$ | async; as user) {
        <p class="px-3 py-1 text-xs text-muted truncate">{{ user.fullName }}</p>
      }
      <a
        routerLink="/"
        class="flex items-center gap-2.5 px-3 py-2.5 rounded-lg text-sm font-semibold text-muted hover:text-white hover:bg-white/5 active:bg-white/10 transition"
      >
        <app-icon name="chevronRight" class="w-4 h-4 rotate-180" />
        Volver al sitio
      </a>
      <button
        (click)="logout()"
        class="w-full flex items-center gap-2.5 px-3 py-2.5 rounded-lg text-sm font-semibold text-muted hover:text-white hover:bg-white/5 active:bg-white/10 transition text-left"
      >
        <app-icon name="close" class="w-4 h-4" />
        Cerrar sesión
      </button>
    </div>
  </aside>

  <main class="flex-1 min-w-0 p-5 lg:p-8">
    <router-outlet />
  </main>
</div>
