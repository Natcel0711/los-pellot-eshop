<div class="fixed bottom-5 left-1/2 -translate-x-1/2 z-60 flex flex-col items-center gap-2">
  @for (toast of toasts(); track toast.id) {
    <div
      class="bg-surface border border-blue/40 text-white text-sm font-medium px-5 py-3 rounded-full shadow-lg flex items-center gap-2 glow-border transition-all duration-300"
      [class.opacity-0]="toast.leaving"
      [class.translate-y-2]="toast.leaving"
    >
      <span class="text-blue-glow"><app-icon name="check" class="w-4 h-4" /></span> {{ toast.message }}
    </div>
  }
</div>
