<header class="sticky top-0 z-40 bg-bg/90 backdrop-blur border-b border-white/5">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-20">
      <a routerLink="/" class="flex items-center gap-2 shrink-0">
        <img
          src="assets/logo.png"
          alt="Los Pellot LED and Accessories Distributors"
          class="h-14 w-auto drop-shadow-[0_0_14px_rgba(47,94,255,0.35)]"
        />
      </a>

      <nav class="hidden lg:flex items-center gap-8">
        @for (link of navLinks; track link.path) {
          <a
            [routerLink]="link.path"
            routerLinkActive="text-white"
            [routerLinkActiveOptions]="{ exact: link.path === '/' }"
            #rla="routerLinkActive"
            class="text-sm font-semibold tracking-wide transition-colors relative py-1"
            [class.text-muted]="!rla.isActive"
            [class.hover:text-white]="!rla.isActive"
          >
            {{ link.label.toUpperCase() }}
            @if (rla.isActive) {
              <span class="absolute left-0 right-0 -bottom-1 h-0.5 bg-blue rounded-full"></span>
            }
          </a>
        }
      </nav>

      <div class="flex items-center gap-4">
        <button
          class="hidden sm:flex w-9 h-9 items-center justify-center rounded-full text-muted hover:text-white hover:bg-white/5 transition"
          aria-label="Buscar"
          title="Buscar"
          (click)="ui.toggleSearchBar()"
        >
          <app-icon name="search" class="w-5 h-5" />
        </button>

        <button
          class="w-9 h-9 hidden sm:flex items-center justify-center rounded-full text-muted hover:text-white hover:bg-white/5 transition"
          aria-label="Cuenta"
          [title]="(auth.currentUser$ | async)?.fullName || 'Mi Cuenta'"
          (click)="onAccountClick()"
        >
          @if (auth.currentUser$ | async; as user) {
            <span
              class="w-7 h-7 rounded-full bg-blue/20 border border-blue/40 flex items-center justify-center text-[11px] font-bold text-blue-glow"
            >{{ initials(user.fullName) }}</span>
          } @else {
            <app-icon name="user" class="w-5 h-5" />
          }
        </button>

        <button
          class="relative w-9 h-9 flex items-center justify-center rounded-full text-muted hover:text-white hover:bg-white/5 transition"
          aria-label="Carrito"
          (click)="ui.openCartDrawer()"
        >
          <app-icon name="cart" class="w-5 h-5" />
          @if ((cart.count$ | async); as count) {
            @if (count > 0) {
              <span
                class="cart-pulse absolute -top-1 -right-1 min-w-4.5 h-4.5 px-1 rounded-full bg-blue text-[10px] font-bold text-white flex items-center justify-center"
              >{{ count }}</span>
            }
          }
        </button>

        <button
          class="lg:hidden w-9 h-9 flex items-center justify-center rounded-full text-white"
          aria-label="Menú"
          (click)="ui.toggleMobileMenu()"
        >
          <app-icon name="menu" class="w-6 h-6" />
        </button>
      </div>
    </div>
  </div>

  @if (ui.searchBarOpen$ | async) {
    <div class="border-t border-white/5 bg-surface">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3">
        <form class="flex items-center gap-3" (submit)="$event.preventDefault(); submitSearch(searchInput)">
          <span class="text-muted"><app-icon name="search" class="w-5 h-5" /></span>
          <input
            #searchInput
            type="text"
            placeholder="Buscar faros, LEDs, kits…"
            class="flex-1 bg-transparent text-white placeholder-muted text-sm focus:outline-none"
          />
        </form>
      </div>
    </div>
  }

  @if (ui.mobileMenuOpen$ | async) {
    <div class="lg:hidden border-t border-white/5 bg-surface">
      @for (link of navLinks; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="text-white bg-white/5"
          [routerLinkActiveOptions]="{ exact: link.path === '/' }"
          (click)="ui.closeMobileMenu()"
          class="block px-5 py-3 text-sm font-semibold tracking-wide border-b border-white/5 text-muted"
        >
          {{ link.label.toUpperCase() }}
        </a>
      }
      <button
        class="block w-full px-5 py-3 text-sm font-semibold tracking-wide text-muted text-left"
        (click)="onMobileAccountClick()"
      >
        @if (auth.currentUser$ | async; as user) {
          MI CUENTA ({{ user.fullName.split(' ')[0].toUpperCase() }})
        } @else {
          INICIAR SESIÓN
        }
      </button>
    </div>
  }
</header>
